name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/root/worldmonitor' }}
      VPS_SERVICE_COMMAND: ${{ secrets.VPS_SERVICE_COMMAND || 'systemctl reload worldmonitor' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync repository to VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_DEPLOY_PATH'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'blog-site/node_modules/' \
            --exclude 'pro-test/node_modules/' \
            --exclude 'dist/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'docker-compose.override.yml' \
            --exclude 'secrets/' \
            --exclude 'ops/' \
            ./ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"

      - name: Build and restart on VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_DEPLOY_PATH='$VPS_DEPLOY_PATH' VPS_SERVICE_COMMAND='$VPS_SERVICE_COMMAND' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$VPS_DEPLOY_PATH"
          if [ -f docker/worldmonitor.service ]; then
            sed "s#__REPO_DIR__#${VPS_DEPLOY_PATH}#g" docker/worldmonitor.service > /etc/systemd/system/worldmonitor.service
            systemctl daemon-reload
          fi
          npm ci
          npm run build
          eval "$VPS_SERVICE_COMMAND"
          REMOTE
